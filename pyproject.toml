[project]
name = "gamota-game-market-intelligence"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.11,<3", "streamlit>=1.50,<2", "google-genai>=1.40,<2", "httpx>=0.28,<1", "trafilatura>=2,<3", "pypdf>=6,<7"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
